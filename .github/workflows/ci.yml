name: CI
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned check tools
        run: |
          npm ci --ignore-scripts --workspaces=false --no-audit --no-fund
          python -m pip install -r requirements-ci.txt
      - name: Lint and credential guards
        run: |
          npm run lint
          python -m ruff check --select E9,F63,F7,F82 sauti tests eval contrib
          npm run security:secrets
      - name: Platform guard tests
        run: npm run test:platform
      - name: Core typecheck, test and build
        shell: bash
        run: |
          if [[ -f packages/core/package.json ]]; then
            node -e 'if (require("./packages/core/package.json").name !== "@sauti/core") process.exit(1)'
            npm ci --prefix packages/core --ignore-scripts --workspaces=false --no-audit --no-fund
            npm run typecheck --prefix packages/core --workspaces=false
            npm test --prefix packages/core --workspaces=false
            npm run build --prefix packages/core --workspaces=false
          else
            echo 'Core package has not landed; no core pass is claimed by this bootstrap revision.'
          fi
      - name: Python reference and evaluation tests
        run: python -B -m pytest -q -p no:cacheprovider tests eval
